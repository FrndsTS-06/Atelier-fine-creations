<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1914" />
      <stop offset="40%" stop-color="#0e0f12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="goldChoker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="60%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#805d04" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#heroBg)" />
  <circle cx="600" cy="400" r="320" fill="none" stroke="#252119" stroke-width="1" stroke-dasharray="6 4" />
  <circle cx="600" cy="400" r="260" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.3" />
  
  <!-- Choker Silhouette -->
  <g transform="translate(600, 380) scale(1.6)" filter="url(#softGlow)">
    <path d="M-120,-80 Q0,80 120,-80 Q80,-40 0,20 Q-80,-40 -120,-80 Z" fill="url(#goldChoker)" />
    <!-- Intricate drops -->
    <path d="M-90,-40 Q0,110 90,-40" fill="none" stroke="url(#goldChoker)" stroke-width="4" />
    <path d="M-60,-10 Q0,130 60,-10" fill="none" stroke="url(#goldChoker)" stroke-width="3" />
    <circle cx="0" cy="140" r="14" fill="url(#goldChoker)" />
    <circle cx="-35" cy="115" r="9" fill="url(#goldChoker)" />
    <circle cx="35" cy="115" r="9" fill="url(#goldChoker)" />
    <circle cx="-70" cy="80" r="7" fill="url(#goldChoker)" />
    <circle cx="70" cy="80" r="7" fill="url(#goldChoker)" />
    <!-- Diamond sparkles -->
    <polygon points="0,132 3,140 0,148 -3,140" fill="#ffffff" />
    <polygon points="-35,108 -32,115 -35,122 -38,115" fill="#ffffff" />
    <polygon points="35,108 38,115 35,122 32,115" fill="#ffffff" />
  </g>
  <text x="600" y="680" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" letter-spacing="8" fill="#d4af37" opacity="0.6">
    IMPERIAL MASTERPIECE • 22 KARAT PURE GOLD
  </text>
</svg>
