<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1f1816" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#735203" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#prodBg)" />
  <g transform="translate(300, 310)">
    <!-- Knot motif -->
    <ellipse cx="0" cy="15" rx="100" ry="80" fill="none" stroke="url(#gold)" stroke-width="20" />
    <circle cx="-15" cy="-70" r="24" fill="none" stroke="url(#gold)" stroke-width="14" />
    <circle cx="15" cy="-70" r="24" fill="none" stroke="url(#gold)" stroke-width="14" />
    <circle cx="0" cy="-70" r="8" fill="#ffffff" />
