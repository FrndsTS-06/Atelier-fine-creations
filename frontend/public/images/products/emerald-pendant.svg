<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#141c18" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#735203" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#prodBg)" />
  <g transform="translate(300, 290)">
    <!-- Chain -->
    <path d="M-120,-120 C-60,40 60,40 120,-120" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="6 4" />
    <!-- Pendant Halo -->
    <rect x="-55" y="30" width="110" height="130" rx="20" fill="url(#gold)" />
    <!-- Emerald Octagon -->
    <polygon points="-38,50 38,50 48,60 48,130 38,140 -38,140 -48,130 -48,60" fill="url(#emerald)" />
    <polygon points="-28,62 28,62 36,70 36,120 28,128 -28,128 -36,120 -36,70" fill="#10b981" opacity="0.6" />
    <circle cx="0" cy="18" r="7" fill="url(#gold)" />
  </g>
</svg>
