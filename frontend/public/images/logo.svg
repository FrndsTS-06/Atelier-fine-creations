<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECD499" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 8)">
    <!-- Monogram Emblem -->
    <circle cx="22" cy="22" r="21" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="17" fill="none" stroke="url(#goldGradient)" stroke-width="0.8" stroke-dasharray="3 2"/>
    <path d="M22 8 L31 22 L22 36 L13 22 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1.8"/>
    <circle cx="22" cy="22" r="3.5" fill="url(#goldGradient)" filter="url(#goldGlow)"/>
  </g>
  <!-- Typography -->
  <text x="64" y="32" font-family="'Cinzel', serif" font-size="24" font-weight="700" letter-spacing="4" fill="url(#goldGradient)">
    AURÉLIEN
  </text>
  <text x="66" y="46" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" letter-spacing="5" fill="#C5A059" opacity="0.9">
    HAUTE JOAILLERIE • PARIS
  </text>
</svg>
