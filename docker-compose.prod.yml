version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurelien_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurelien_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretSecurePassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-aurelien_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurelien_admin} -d ${POSTGRES_DB:-aurelien_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aurelien_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aurelien_admin}:${POSTGRES_PASSWORD:-SuperSecretSecurePassword2026!}@postgres:5432/${POSTGRES_DB:-aurelien_production}?schema=public
      JWT_SECRET: ${JWT_SECRET:-prod_secure_jwt_secret_high_entropy_random_hash_64chars}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@aurelien.gold}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-AdminPassword123!}
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aurelien_web_prod
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
